# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: en-US
early_access: false

reviews:
  profile: "chill"
  high_level_summary: false
  poem: false
  request_changes_workflow: false
  collapse_walkthrough: true

  path_filters:
    - "!vendor/**"
    - "!**/vendor/**"
    - "!**/zz_generated*"
    - "!go.sum"
    - "!go.tools.sum"
    # Upstream-only files not used in our CI
    - "!.github/**"
    - "!designs/**"

  path_instructions:
    - path: "pkg/apis/**/*.go"
      instructions: |
        Review CRD API types for backward compatibility, correct
        kubebuilder validation markers, proper JSON tags, and deepcopy
        compliance. API changes require make verify, a follow-up to copy
        CRDs into openshift/karpenter-operator pkg/assets/crds/, and
        replace bumps in the AWS and Azure provider forks.

    - path: "hack/openshift*"
      instructions: |
        OpenShift CI entrypoints. openshift-kwok-e2e.sh and
        openshift-toolchain.sh must match what Prow invokes.

    - path: "Makefile"
      instructions: |
        OpenShift CI calls make test, make openshift-verify, and
        make openshift-toolchain. Keep JUNIT_REPORT and the
        openshift-* carry targets.

  tools:
    gitleaks:
      enabled: true
    golangci-lint:
      enabled: true

  knowledge_base:
    code_guidelines:
      enabled: true
      filePatterns:
        - "**/AGENTS.md"
        - "**/CONTRIBUTING_OPENSHIFT.md"
    learnings:
      scope: auto
    issues:
      scope: auto
    pull_requests:
      scope: auto
